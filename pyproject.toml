[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-trading-strategy-agents"
version = "0.1.0"
description = "Plug in any LLM and spin up a team of AI agents that research markets 24/7, find mispricings, generate trading strategies, backtest them on years of data and keep only the high-Sharpe winners."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "roan-maverick" }]
keywords = ["ai-trading", "trading-strategy", "algorithmic-trading", "backtesting", "llm", "multi-agent", "quant", "gemini"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Investment",
  "Intended Audience :: Financial and Insurance Industry",
]
dependencies = [
  "numpy>=1.26",
  "polars>=1.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "numba>=0.59",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
yahoo = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["fastapi>=0.110", "uvicorn>=0.29", "yfinance>=0.2.40"]

[project.scripts]
atsa = "atsa.cli:app"

[project.urls]
Homepage = "https://github.com/roan-maverick/ai-trading-strategy-agents"

[tool.hatch.build.targets.wheel]
packages = ["src/atsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B905"]  # typer.Option defaults are the typer idiom; zip strictness is checked by tests
